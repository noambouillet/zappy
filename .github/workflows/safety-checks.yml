name: safety

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  MIRROR_URL: git@github.com:EpitechPGE2-2025/G-YEP-400-LIL-4-1-zappy-6.git

permissions:
  contents: read
  pull-requests: write

jobs:
  check_repo:
    runs-on: ubuntu-latest
    outputs:
      is_mirror: ${{ steps.detect.outputs.is_mirror }}
    steps:
      - name: Detect mirror repo or ignored branch
        id: detect
        run: |
          repo_ssh_url="git@github.com:${{ github.repository }}.git"
          is_mirror=false

          if [ "$repo_ssh_url" = "${{ env.MIRROR_URL }}" ]; then
            is_mirror=true
          fi

          branch_name="${GITHUB_REF#refs/heads/}"
          if echo "$branch_name" | grep -q '^ga-ignore-'; then
            is_mirror=true
          fi

          echo "is_mirror=$is_mirror" >> "$GITHUB_OUTPUT"

  check_program_compilation:
    needs: check_repo
    if: needs.check_repo.outputs.is_mirror == 'false'
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Full clean
        run: |
          if make -n clean >/dev/null 2>&1; then
            make clean
          else
            echo "Skipping clean: target not found"
          fi

      - name: Compile
        run: make

      - name: Check executables exist
        env:
          EXECUTABLES: "zappy_server,zappy_gui,zappy_ai"
        run: |
          OLD_IFS="$IFS"
          IFS=','
          set -- $EXECUTABLES
          IFS="$OLD_IFS"
          for exec in "$@"; do
            if [ ! -x "$exec" ]; then
              echo "::error file=$exec::Missing or non-executable $exec"
              exit 1
            fi
          done

      - name: Clean
        run: |
          if make -n flean >/dev/null 2>&1; then
            make flean
          else
            echo "Skipping fclean: target not found"
          fi

      - name: Check expected executables were cleaned
        env:
          EXECUTABLES: "zappy_server,zappy_gui,zappy_ai"
        run: |
          OLD_IFS="$IFS"
          IFS=','
          set -- $EXECUTABLES
          IFS="$OLD_IFS"
          for exec in "$@"; do
            if [ -e "$exec" ]; then
              echo "::error file=$exec::Executable still exists after make fclean"
              exit 1
            fi
          done

  run_tests:
    needs: check_program_compilation
    if: needs.check_repo.outputs.is_mirror == 'false'
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          if make -n tests_run >/dev/null 2>&1; then
            make tests_run
          else
            echo "Skipping tests_run: target not found"
          fi

  push_to_mirror:
    needs: [check_repo, run_tests]
    if: needs.check_repo.outputs.is_mirror == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
